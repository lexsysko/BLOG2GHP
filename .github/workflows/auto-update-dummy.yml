name: Keep-Alive Activity

on:
  schedule:
    # Runs every 30 days at midnight (UTC)
    - cron: '0 0 */30 * *'
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the workflow permission to commit to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

       
      - name: Update keep-alive timestamp
        run: |
          mkdir -p keep-alive
          date -u > keep-alive/timestamp.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B keep-alive-branch
          git add keep-alive/timestamp.txt
          git commit -m "chore: automated keep-alive ping to prevent inactivity suspension"
          git push origin keep-alive-branch --force

